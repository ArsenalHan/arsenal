<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Corporate Portfolio</title>
    <style>
        :root {
            --primary-color: #1a1a1a;
            --accent-color: #005ae0;
            --text-main: #333333;
            --text-muted: #666666;
            --bg-light: #f8f9fa;
            --white: #ffffff;
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            line-height: 1.6;
            color: var(--text-main);
            background-color: var(--white);
            -webkit-font-smoothing: antialiased;
        }

        /* Navigation */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 10%;
            position: fixed;
            width: 100%;
            top: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            z-index: 1000;
            border-bottom: 1px solid #eeeeee;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -1px;
            color: var(--primary-color);
        }

        .nav-links {
            display: flex;
            gap: 2.5rem;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-main);
            font-weight: 500;
            font-size: 0.95rem;
            transition: var(--transition);
        }

        .nav-links a:hover {
            color: var(--accent-color);
        }

        /* Hero Section */
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 15%;
            background: radial-gradient(circle at top right, #f0f7ff 0%, #ffffff 100%);
            margin-top: 0;
        }

        .hero h1 {
            font-size: 4rem;
            line-height: 1.1;
            margin-bottom: 1.5rem;
            color: var(--primary-color);
            font-weight: 800;
        }

        .hero p {
            font-size: 1.25rem;
            color: var(--text-muted);
            max-width: 700px;
            margin-bottom: 2.5rem;
        }

        .btn {
            padding: 1rem 2.5rem;
            border-radius: 4px;
            font-weight: 600;
            text-decoration: none;
            transition: var(--transition);
            display: inline-block;
        }

        .btn-primary {
            background-color: var(--accent-color);
            color: var(--white);
        }

        .btn-primary:hover {
            background-color: #0049b5;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 90, 224, 0.2);
        }

        /* Features Section */
        .features {
            padding: 8rem 10%;
            background-color: var(--bg-light);
        }

        .section-header {
            text-align: center;
            margin-bottom: 5rem;
        }

        .section-header h2 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
        }

        .card {
            background: var(--white);
            padding: 3rem;
            border-radius: 8px;
            transition: var(--transition);
            border: 1px solid #eaeaea;
        }

        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.05);
        }

        .card h3 {
            margin-bottom: 1rem;
            font-size: 1.5rem;
        }

        /* Footer */
        footer {
            padding: 5rem 10%;
            background: var(--primary-color);
            color: var(--white);
            text-align: center;
        }

        @media (max-width: 768px) {
            .hero h1 { font-size: 2.5rem; }
            .nav-links { display: none; }
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">STRATOS</div>
        <ul class="nav-links">
            <li><a href="#home">首页</a></li>
            <li><a href="#services">服务</a></li>
            <li><a href="#about">关于</a></li>
            <li><a href="#contact">联系</a></li>
        </ul>
    </nav>

    <section class="hero" id="home">
        <h1>构建驱动未来的<br>数字生产力</h1>
        <p>通过深度整合人工智能与系统工程，我们为全球企业提供最高维度的数字化转型解决方案，将复杂业务重构为清晰的增长逻辑。</p>
        <a href="#" class="btn btn-primary">立即开始</a>
    </section>

    <section class="features" id="services">
        <div class="section-header">
            <h2>核心能力</h2>
            <p>基于第一性原理，从底层逻辑解决增长瓶颈</p>
        </div>
        <div class="grid">
            <div class="card">
                <h3>架构重组</h3>
                <p>消除冗余系统，建立高内聚低耦合的数字基座，提升组织响应速度。</p>
            </div>
            <div class="card">
                <h3>数据智能</h3>
                <p>将碎片化数据转化为结构化资产，实现决策过程的量化与自动化。</p>
            </div>
            <div class="card">
                <h3>体验工程</h3>
                <p>极致的交互设计不仅是视觉，更是对用户认知负荷的深度优化。</p>
            </div>
        </div>
    </section>

    <footer>
        <p>&copy; 2025 STRATOS INC. 保持理性，持续进化。</p>
    </footer>

</body>
</html>
